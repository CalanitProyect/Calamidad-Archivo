<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

margin:0;

background:#ece5d8;

display:flex;

justify-content:center;

min-height:100vh;

overflow:auto;

font-family:'Special Elite', serif;

}

.tablero{

position:relative;

width:min(95vw,1200px);

height:900px;

overflow:hidden;

}
.corcho{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

object-fit:fill;

z-index:-1;

}

.expediente,
.objeto,
.entradas{

z-index:2;

}
/* ------------------------- */

.expediente{

position:absolute;

left:70px;
top:50px;

width:360px;

background:#f8f3ea;

padding:35px;

transform:rotate(-2deg);

box-shadow:0 10px 18px rgba(0,0,0,.30);

}

.expediente h1{

letter-spacing:5px;

font-size:30px;

margin-bottom:20px;

}

.expediente p{

line-height:1.8;

font-size:15px;

}

.cinta{

position:absolute;

width:120px;

height:35px;

background:rgba(235,220,170,.55);

top:-10px;

left:120px;

transform:rotate(3deg);

}

/* ------------------------- */

.objeto{

position:absolute;

transition:.25s;

}
.objeto .pin{

display:block;

width:35px;

height:auto;

filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));

}

.pieza{

display:block;

filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));

transition:.25s;

}
.pieza{

background:#faf7f1;

padding:10px 10px 26px;

border:1px solid rgba(0,0,0,.08);

box-shadow:
0 8px 18px rgba(0,0,0,.28);

}
.objeto{

transition:transform .25s;
}

.objeto:hover{

transform:scale(1.04);
}
.objeto img{

display:block;

filter:drop-shadow(0 10px 12px rgba(0,0,0,.35));

transition:.25s;

}

.objeto:hover img{

transform:scale(1.08) rotate(-4deg);

}

.chinche{

width:14px;

height:14px;

background:#b12d2d;

border-radius:50%;

margin:auto;

margin-bottom:-4px;

box-shadow:0 2px 4px rgba(0,0,0,.45);

position:relative;

z-index:5;

}

/* ------------------------- */

/* ------------------------- */

.fichin{

left:58%;
top:12%;

transform:rotate(-8deg);

}

.fichin img{

width:120px;

}

/* ------------------------- */

.libro{

left:76%;
top:17%;

transform:rotate(5deg);

}

.libro img{

width:180px;

}

/* ------------------------- */

.tacita{

left:50%;
top:46%;

transform:rotate(7deg);

}

.tacita img{

width:130px;

}

/* ------------------------- */

.entrada{

left:77%;
top:41%;

transform:rotate(-9deg);

}

.entrada img{

width:170px;

}

/* ------------------------- */

.llave{

left:23%;
top:73%;

transform:rotate(-12deg);

}

.llave img{

width:180px;

}

/* ------------------------- */

.cenicero{

left:58%;
top:72%;

transform:rotate(6deg);

}

.cenicero img{

width:150px;

}

/* ------------------------- */

.vhs{

left:80%;
top:76%;

transform:rotate(-4deg);

}

.vhs img{

width:170px;

}

/* ------------------------- */

.entradas{

position:absolute;

right:60px;

bottom:40px;

background:#f8f3ea;

padding:18px 28px;

text-decoration:none;

color:#222;

border:1px solid #999;

box-shadow:0 8px 15px rgba(0,0,0,.25);

transform:rotate(2deg);

transition:.2s;

}

.entradas:hover{

transform:rotate(0deg) scale(1.05);

}

</style>
