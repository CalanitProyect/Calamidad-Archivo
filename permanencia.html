<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo 06/07 - Permanencia | Calamidad</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/cancion.css">

    <style>
        /* Aseguramos que el contenedor del archivo sea el punto de referencia */
        .archivo {
            position: relative;
        }

        /* Referencia específica para el encabezado donde se ubicará la taza */
        .encabezado-archivo {
            position: relative;
        }

        /* Objeto flotante: Tacita rota ubicada a la derecha del texto */
        .tacita-rota {
            position: absolute;
            top: 60px;             /* Distancia desde el borde superior del encabezado */
            right: 15px;          /* Ubicación a la derecha del texto */
            width: 120px;         /* Tamaño proporcional para que luzca bien sobre el papel */
            height: auto;
            z-index: 10;
            transform: rotate(8deg);
            filter: drop-shadow(4px 8px 10px rgba(0, 0, 0, 0.35));
            pointer-events: none; /* Permite hacer clic a través de la imagen si tapara texto */
            transition: transform 0.3s ease;
        }

        /* Ajuste para pantallas pequeñas */
        @media (max-width: 768px) {
            .tacita-rota {
                width: 80px;
                top: 0px;
                right: 5px;
            }
        }
    </style>
</head>
<body>

    <main class="contenedor">
        <article class="archivo">

            <header class="encabezado-archivo">
                <img class="tacita-rota" src="img/tacitarota.png" alt="Tacita rota de cerámica">

                <span class="codigo-archivo">ARCHIVO RECUPERADO 05
